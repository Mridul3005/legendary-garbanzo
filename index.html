        let protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        let ws = new WebSocket(protocol + window.location.host + "/ws");
        let messagesContainer = document.getElementById('messages');

        // Tab Notification State
        let unreadCount = 0;
        const originalTitle = "Talkrr";
        let titleInterval = null;

        // Typing Indicator State
        let typingTimeout = null;
        let isTyping = false;

        // Dark mode toggle event listener
        const toggleButton = document.getElementById('toggleButton');
        if (toggleButton) {
            toggleButton.addEventListener('change', function() {
                if (this.checked) {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
            });
        }

        // Clear notification whenever the user clicks into or views the tab
        function clearTabNotification() {
            unreadCount = 0;
            if (titleInterval) {
                clearInterval(titleInterval);
                titleInterval = null;
            }
            document.title = originalTitle;
        }

        window.addEventListener('focus', clearTabNotification);
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                clearTabNotification();
            }
        });

        function notifyNewMessage() {
            if (document.hidden) {
                unreadCount++;
                if (!titleInterval) {
                    let isOriginal = false;
                    titleInterval = setInterval(() => {
                        if (isOriginal) {
                            document.title = originalTitle;
                        } else {
                            document.title = `(${unreadCount}) New Message!`;
                        }
                        isOriginal = !isOriginal;
                    }, 1000);
                }
            }
        }

        // Send typing status via WebSocket
        function sendTypingStatus(typing) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                let payload = {
                    type: "typing",
                    target: currentTarget,
                    isTyping: typing
                };
                //console.log("[DIAGNOSTIC] Sending WebSocket typing payload:", payload);
                ws.send(JSON.stringify(payload));
            } else {
                console.warn("[DIAGNOSTIC] Cannot send typing status! Socket state is:", ws ? ws.readyState : "undefined");
            }
        }

        // Attach input listener safely
        function initTypingListener() {
            const inputEl = document.getElementById("messageText");
            if (inputEl) {
                //console.log("[DIAGNOSTIC] Attached typing input event listener to #messageText");
                inputEl.addEventListener("input", function() {
                    //console.log("[DIAGNOSTIC] Key stroke detected in input field.");
                    
                    if (!isTyping) {
                        isTyping = true;
                        sendTypingStatus(true);
                    }

                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => {
                        //console.log("[DIAGNOSTIC] Typing timeout reached (1.5s idle). Stopping typing state.");
                        isTyping = false;
                        sendTypingStatus(false);
                    }, 1500);
                });

                inputEl.addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        sendMessage();
                    }
                });
            } else {
                console.error("[DIAGNOSTIC] Failed to find #messageText element!");
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initTypingListener);
        } else {
            initTypingListener();
        }

            //console.log("[DIAGNOSTIC] WebSocket connection opened successfully.");
            ws.send(JSON.stringify({ type: "join", username: username }));
        };

        ws.onerror = function(error) {
            console.error("[DIAGNOSTIC] WebSocket Error encountered:", error);
        };

        ws.onclose = function(event) {
            //console.warn("[DIAGNOSTIC] WebSocket connection closed.", event);

            let data = JSON.parse(event.data);

            if (data.type === "system") {
                addMessage(data.text, "system", "System");
            } 
            else if (data.type === "message") {
                hideTypingIndicator();
                let isPrivate = data.target !== "Group";
                addMessage(data.text, isPrivate ? "private" : "standard", data.sender);
                
                if (data.sender !== username) {
                    notifyNewMessage();
                }
            }
            else if (data.type === "typing") {
                //console.log("[DIAGNOSTIC] Typing event received from server:", data);
                if (data.sender !== username) {
                    if (data.isTyping) {
                        showTypingIndicator(data.sender);
                    } else {
                        hideTypingIndicator();
                    }
                }
            }
            else if (data.type === "user_list") {
                updateUserList(data.users);
            }
        };

        function showTypingIndicator(sender) {
            let indicator = document.getElementById("typingIndicator");
            if (!indicator) {
                indicator = document.createElement("div");
                indicator.id = "typingIndicator";
                indicator.className = "message-system";
                messagesContainer.appendChild(indicator);
            }
            indicator.textContent = `${sender} is typing...`;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            let indicator = document.getElementById("typingIndicator");
            if (indicator) {
                indicator.remove();
            }
        }

        function addMessage(text, type, sender) {
            let messageDiv = document.createElement('div');
            
            if (type === "system") {
                messageDiv.className = "message-system";
                messageDiv.textContent = text;
            } else {
                let isMe = (sender === username);
                
                let bubbleClass = isMe ? "message-mine" : "message-theirs";
                let privateClass = type === "private" ? "message-private" : "";
                messageDiv.className = `message-bubble ${bubbleClass} ${privateClass}`;
                
                let privateTag = type === "private" ? '🔒 ' : '';

                if (isMe) {
                    messageDiv.innerHTML = `${privateTag}${text}`;
                } else {
                    messageDiv.innerHTML = `<span class="sender-name">${sender}</span>${privateTag}${text}`;
                }
            }

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function updateUserList(users) {
            let listDiv = document.getElementById("userList");
            listDiv.innerHTML = ""; 

            let groupDiv = document.createElement("div");
            groupDiv.className = `user-item ${currentTarget === "Group" ? "active" : ""}`;
            groupDiv.textContent = "🌍 Everyone (Group)";
            groupDiv.onclick = () => setTarget("Group", groupDiv);
            listDiv.appendChild(groupDiv);

            users.forEach(user => {
                if (user !== username) { 
                    let userDiv = document.createElement("div");
                    userDiv.className = `user-item ${currentTarget === user ? "active" : ""}`;
                    userDiv.textContent = "👤 " + user;
                    userDiv.onclick = () => setTarget(user, userDiv);
                    listDiv.appendChild(userDiv);
                }
            });
        }

        function setTarget(target, element) {
            currentTarget = target;
            document.getElementById("chatHeaderText").textContent = "Chatting with: " + target;
            
            document.querySelectorAll(".user-item").forEach(el => el.classList.remove("active"));
            element.classList.add("active");
            hideTypingIndicator();
        }

        function sendMessage() {
            let input = document.getElementById("messageText");
            if (input.value.trim() !== "") {
                clearTimeout(typingTimeout);
                isTyping = false;
                sendTypingStatus(false);

                let payload = {
                    type: "message",
                    target: currentTarget,
                    text: input.value
                };
                ws.send(JSON.stringify(payload));
                input.value = '';
                input.focus();
            }
        }

                        isTyping = false;
                        sendTypingStatus(false);
                    }, 1500);
                });

                inputEl.addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        sendMessage();
                    }
                });
            } else {
                console.error("[DIAGNOSTIC] Failed to find #messageText element!");
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initTypingListener);
        } else {
            initTypingListener();
        }

        ws.onopen = function() {
            ws.send(JSON.stringify({ type: "join", username: username }));
        };

        ws.onerror = function(error) {
            console.error("[DIAGNOSTIC] WebSocket Error encountered:", error);
        };

        ws.onclose = function(event) {
            // WebSocket closed
        };

        ws.onmessage = function(event) {
            let data = JSON.parse(event.data);

            if (data.type === "system") {
                addMessage(data.text, "system", "System", "Group");
            } 
            else if (data.type === "message") {
                hideTypingIndicator();
                let isPrivate = data.target !== "Group";
                
                let conversationTarget = data.sender === username ? data.target : data.sender;
                if (data.target === "Group") conversationTarget = "Group";

                let messageType = isPrivate ? "private" : "standard";
                addMessage(data.text, messageType, data.sender, conversationTarget);
                
                if (data.sender !== username) {
                    notifyNewMessage();
                }
            }
            else if (data.type === "typing") {
                if (data.sender !== username) {
                    if (data.isTyping) {
                        showTypingIndicator(data.sender);
                    } else {
                        hideTypingIndicator();
                    }
                }
            }
            else if (data.type === "user_list") {
                updateUserList(data.users);
            }
        };

        function showTypingIndicator(sender) {
            let indicator = document.getElementById("typingIndicator");
            if (!indicator) {
                indicator = document.createElement("div");
                indicator.id = "typingIndicator";
                indicator.className = "message-system";
                messagesContainer.appendChild(indicator);
            }
            indicator.textContent = `${sender} is typing...`;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            let indicator = document.getElementById("typingIndicator");
            if (indicator) {
                indicator.remove();
            }
        }

        function addMessage(text, type, sender, target) {
            if (!messageStore[target]) {
                messageStore[target] = [];
            }

            let messageDiv = document.createElement('div');
            
            if (type === "system") {
                messageDiv.className = "message-system";
                messageDiv.textContent = text;
            } else {
                let isMe = (sender === username);
                
                let bubbleClass = isMe ? "message-mine" : "message-theirs";
                let privateClass = type === "private" ? "message-private" : "";
                messageDiv.className = `message-bubble ${bubbleClass} ${privateClass}`;
                
                let privateTag = type === "private" ? '🔒 ' : '';

                if (isMe) {
                    messageDiv.innerHTML = `${privateTag}${text}`;
                } else {
                    messageDiv.innerHTML = `<span class="sender-name">${sender}</span>${privateTag}${text}`;
                }
            }

            messageStore[target].push(messageDiv);

            if (currentTarget === target) {
                messagesContainer.appendChild(messageDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        function updateUserList(users) {
            let listDiv = document.getElementById("userList");
            listDiv.innerHTML = ""; 

            let groupDiv = document.createElement("div");
            groupDiv.className = `user-item ${currentTarget === "Group" ? "active" : ""}`;
            groupDiv.textContent = "🌍 Everyone (Group)";
            groupDiv.onclick = () => setTarget("Group", groupDiv);
            listDiv.appendChild(groupDiv);

            users.forEach(user => {
                if (user !== username) { 
                    if (!messageStore[user]) {
                        messageStore[user] = [];
                    }
                    let userDiv = document.createElement("div");
                    userDiv.className = `user-item ${currentTarget === user ? "active" : ""}`;
                    userDiv.textContent = "👤 " + user;
                    userDiv.onclick = () => setTarget(user, userDiv);
                    listDiv.appendChild(userDiv);
                }
            });
        }

        function setTarget(target, element) {
            currentTarget = target;
            document.getElementById("chatHeaderText").textContent = "Chatting with: " + target;
            
            document.querySelectorAll(".user-item").forEach(el => el.classList.remove("active"));
            element.classList.add("active");
            hideTypingIndicator();

            messagesContainer.innerHTML = "";

            if (!messageStore[currentTarget]) {
                messageStore[currentTarget] = [];
            }

            messageStore[currentTarget].forEach(msgDiv => {
                messagesContainer.appendChild(msgDiv);
            });

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function sendMessage() {
            let input = document.getElementById("messageText");
            if (input.value.trim() !== "") {
                clearTimeout(typingTimeout);
                isTyping = false;
                sendTypingStatus(false);

                let payload = {
                    type: "message",
                    target: currentTarget,
                    text: input.value
                };
                ws.send(JSON.stringify(payload));

                let isPrivate = currentTarget !== "Group";
                let messageType = isPrivate ? "private" : "standard";
                addMessage(input.value, messageType, username, currentTarget);

                input.value = '';
                input.focus();
            }
        }
    </script>
</body>
</html>
